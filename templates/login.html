<body class="login-body">

<canvas id="matrix"></canvas>

<div class="background-glow"></div>


<div class="login-container">

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SilentHub Login</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="login-container">


    <div class="login-box">


        <div class="logo">

            <h1>
                SilentHub
            </h1>

            <p>
                PRIVATE ACCESS
            </p>

        </div>



        <form method="POST">


            <input
            type="text"
            name="username"
            placeholder="Username"
            required>



            <input
            type="password"
            name="password"
            placeholder="Password"
            required>



            <button
            type="submit"
            class="access-btn">

                ACCESS

            </button>


        </form>



        {% with messages = get_flashed_messages() %}

        {% if messages %}


        <div class="error">

            {{ messages[0] }}

        </div>


        {% endif %}

        {% endwith %}



        <div class="footer-text">

            SilentHub Security System

        </div>


    </div>


</div>


</body>

</html>

</div>


<script src="{{ url_for('static', filename='matrix.js') }}"></script>

</body>
